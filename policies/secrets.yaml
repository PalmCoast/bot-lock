# Bot Lock — Secrets & credential handling for agents
# Secrets never ride in prompts, chat history, or shared agent memory.

version: "1.0"
policy_id: botlock.secrets
mode: vault_only

rules:
  - id: no_secrets_in_prompts
    enforce: true
    description: "API keys, tokens, passwords must not appear in system/user/tool prompts"
  - id: no_secrets_in_memory
    enforce: true
    description: "Long-term agent memory and RAG corpora must not store raw credentials"
  - id: short_lived_tokens
    enforce: true
    max_ttl_seconds: 900
    description: "Prefer task-scoped, time-bound credentials over long-lived god tokens"
  - id: separate_nhi
    enforce: true
    description: "Agent non-human identity is distinct from human user identity"
  - id: audience_binding
    enforce: true
    description: "OAuth/token exchange must bind audience; no bearer passthrough across agents"
  - id: vault_issuance
    enforce: true
    description: "Credentials issued from vault/broker at tool-call time, not preloaded into context"

redaction:
  patterns:
    - "(?i)(api[_-]?key|secret|password|token|bearer)\\s*[:=]\\s*\\S+"
    - "(?i)sk-[a-zA-Z0-9]{20,}"
    - "(?i)ghp_[a-zA-Z0-9]{20,}"
  on_detect: [block_log_export, alert, scrub_context]

forbidden:
  - embedding_secrets_in_system_prompt
  - sharing_one_service_account_across_all_agents
  - token_passthrough_multi_agent
  - committing_env_files_with_live_keys

audit:
  log_issuance: true
  log_revocation: true
  log_denied_secret_access: true
